---
layout: default
header_mode: home
---
<!--
Updated     2026.06.11
Validated   2026.05.15
-->

<!doctype html>

<html lang="en">
  <head>
    <!-- # METADATA -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">   
    <meta property="og:title" content="{{ page.title | default: site.title }} • hellojames">
    <meta property="og:description" content="{{ page.description | default: site.description }}">    
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <title>{{ page.title | default: site.title }} • hellojames</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="author" href="{{ '/humans.txt' | absolute_url }}" type="text/plain">
    <!-- # SECURITY B -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://i.ytimg.com https://i1.ytimg.com https://i2.ytimg.com https://i3.ytimg.com https://i4.ytimg.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' https://www.youtube-nocookie.com; connect-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com https://drive.google.com;">    
    <!-- # PRESENTATION -->
    <link rel="stylesheet" media="screen" href="{{ '/media/screen.css' | relative_url }}">
    <link rel="stylesheet" media="print" href="{{ '/media/print.css' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="hellojames" href="{{ '/writing/feed.xml' | relative_url }}">
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&display=swap" rel="stylesheet"> -->
    <!-- # ICONS -->
    <link rel="shortcut icon" href="{{ '/media/favicon.ico' | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/media/favicon-96x96.png' | relative_url }}" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="{{ '/media/favicon.svg' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/media/favicon-apple-touch-icon.png' | relative_url }}" sizes="180x180">
    <meta name="apple-mobile-web-app-title" content="hellojames">
    <link rel="manifest" href="{{ '/media/site.webmanifest' | relative_url }}">
  </head>
  
  <body id="top" {% if page.url == "/" %} class="homepage"{% endif %}>

    <a class="skip-to-content" href="#content">skip to content</a>
    
    <div class="wrapper">

      <header>
        {% include header.html %}
      </header>

      {{ content }}
 
      <footer>
        {% include footer.html %}
      </footer>
      
    </div>

  </body>
</html>
